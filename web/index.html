<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edk2Agent Web 问答</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel2: #273449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --high: #22c55e;
    --medium: #3b82f6;
    --low: #f59e0b;
    --poor: #94a3b8;
    --border: #334155;
    --user-bubble: #1d4ed8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
    overflow-x: hidden;
  }
  .chat, .msg, .card, .result, .answer, .askbar { min-width: 0; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; flex-wrap: wrap; gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 18px; margin: 0; }
  .status {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    background: var(--panel); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 999px; color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--poor); }
  .dot.ok { background: var(--high); }
  .dot.bad { background: #ef4444; }

  /* chat scroll area */
  .chat {
    flex: 1; overflow-y: auto; padding: 20px;
    max-width: 960px; width: 100%; margin: 0 auto;
  }
  .llm-warn {
    font-size: 12px; color: var(--low);
    background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.3);
    padding: 10px 12px; border-radius: 10px; margin-bottom: 16px;
  }
  .empty-hint { text-align: center; color: var(--muted); margin-top: 60px; font-size: 14px; }
  .empty-hint .ex { margin-top: 16px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  .msg { margin-bottom: 20px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--user-bubble); color: #fff;
    padding: 10px 14px; border-radius: 14px 14px 2px 14px;
    max-width: 75%; font-size: 14px; white-space: pre-wrap; word-break: break-word;
  }
  .msg.assistant .role { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px;
  }
  .card .h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .card .h .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel2); color: var(--muted); }
  .answer { line-height: 1.7; font-size: 14px; word-break: break-word; }
  .answer p { margin: 0 0 10px; }
  .answer h1, .answer h2, .answer h3, .answer h4 { margin: 14px 0 8px; font-size: 16px; }
  .answer h1 { font-size: 18px; } .answer h2 { font-size: 17px; }
  .answer ul, .answer ol { margin: 0 0 10px; padding-left: 22px; }
  .answer li { margin: 3px 0; }
  .answer code {
    background: rgba(148,163,184,.15); padding: 1px 5px; border-radius: 5px;
    font-family: Consolas, "Courier New", monospace; font-size: 13px; color: #7dd3fc;
    word-break: break-all;
  }
  .answer pre {
    background: #0b1120; border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin: 0 0 12px;
    white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  }
  .answer pre code { background: none; padding: 0; font-size: 13px; color: var(--text); line-height: 1.6; word-break: break-word; }
  .answer blockquote {
    margin: 0 0 10px; padding: 2px 14px; border-left: 3px solid var(--accent);
    color: var(--muted); background: var(--panel2); border-radius: 0 8px 8px 0;
  }
  .answer table { border-collapse: collapse; margin: 0 0 12px; font-size: 13px; table-layout: fixed; width: 100%; }
  .answer th, .answer td { border: 1px solid var(--border); padding: 6px 10px; word-break: break-word; overflow-wrap: anywhere; }
  .answer th { background: var(--panel2); }
  .results-title { font-size: 13px; color: var(--muted); margin: 16px 0 10px; }
  .result {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .result .meta { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  .result .num { font-weight: 700; color: var(--accent); font-size: 13px; }
  .conf { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .conf.high { background: rgba(34,197,94,.15); color: var(--high); }
  .conf.medium { background: rgba(59,130,246,.15); color: var(--medium); }
  .conf.low { background: rgba(245,158,11,.15); color: var(--low); }
  .conf.poor { background: rgba(148,163,184,.15); color: var(--poor); }
  .result .title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .result .src { font-size: 12px; color: var(--muted); }
  .result .snippet { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; word-break: break-word; overflow-wrap: anywhere; white-space: pre-wrap; }
  .result .link { font-size: 12px; color: var(--accent); word-break: break-all; }

  .error { color: #fca5a5; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); padding: 12px; border-radius: 10px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .typing { color: var(--muted); font-size: 13px; padding: 6px 2px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* input bar pinned at bottom */
  .askbar {
    border-top: 1px solid var(--border); background: var(--bg);
    padding: 14px 20px;
  }
  .askbar .inner { display: flex; gap: 8px; max-width: 960px; margin: 0 auto; }
  .askbar input {
    flex: 1; padding: 12px 14px; font-size: 15px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    outline: none;
  }
  .askbar input:focus { border-color: var(--accent); }
  .askbar button {
    padding: 12px 24px; font-size: 15px; border: none; border-radius: 10px;
    background: var(--accent); color: #0f172a; font-weight: 600; cursor: pointer;
  }
  .askbar button:disabled { opacity: .5; cursor: wait; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1>Edk2Agent Web 问答</h1>
  <span class="status"><span class="dot" id="dot"></span><span id="statusText">连接中…</span></span>
</header>

<div class="chat" id="chat">
  <div class="empty-hint" id="emptyHint">
    <div>请输入下方 EDK2 / UEFI 技术问题开始问答，历史问答将保留在本页</div>
    <div class="ex" id="examples"></div>
  </div>
</div>

<div class="askbar">
  <div class="inner">
    <input id="q" type="text" placeholder="输入问题后回车，可连续提问…" autocomplete="off">
    <button id="askBtn">提问</button>
  </div>
</div>

<script>
const EXAMPLES = [
  'PcdDebugPrintErrorLevel',
  'BDS boot flow',
  'What is a DXE driver?',
  'UEFI capsule update protocol',
  'Smm base2 protocol',
];

function el(id) { return document.getElementById(id); }

function setStatus(text, cls) {
  el('statusText').textContent = text;
  const dot = el('dot');
  dot.className = 'dot' + (cls ? ' ' + cls : '');
}

function renderConf(conf) {
  const c = (conf || 'unknown').toLowerCase();
  const label = { high: '高置信', medium: '中置信', low: '低置信', poor: '差' }[c] || conf || 'unknown';
  return '<span class="conf ' + (['high','medium','low','poor'].includes(c) ? c : 'poor') + '">' + label + '</span>';
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---- minimal safe Markdown renderer (no external lib) ----
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function mdInline(s) {
  // inline code first (so markers inside code are untouched)
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + esc(codes[+i]) + '</code>');
  return s;
}

function mdParagraphs(src) {
  const lines = src.split('\n');
  const out = [];
  let i = 0;
  let inCode = false;
  let codeBuf = [];
  let inUl = false;
  let inOl = false;

  function closeLists() {
    if (inUl) { out.push('</ul>'); inUl = false; }
    if (inOl) { out.push('</ol>'); inOl = false; }
  }
  function emitCode() {
    if (inCode) {
      out.push('<pre><code>' + esc(codeBuf.join('\n')) + '</code></pre>');
      codeBuf = []; inCode = false;
    }
  }

  while (i < lines.length) {
    const line = lines[i];
    const trimmed = line.trim();

    // fenced code block: open on first ```, close on next ```
    if (/^```/.test(trimmed)) {
      if (inCode) {
        emitCode();
      } else {
        closeLists();
        inCode = true; codeBuf = [];
      }
      i++; continue;
    }
    if (inCode) { codeBuf.push(line); i++; continue; }

    // headings
    const h = /^(#{1,4})\s+(.*)$/.exec(trimmed);
    if (h) {
      closeLists();
      const lvl = h[1].length;
      out.push('<h' + lvl + '>' + mdInline(esc(h[2])) + '</h' + lvl + '>');
      i++; continue;
    }
    // hr
    if (/^([-*_])\1{2,}$/.test(trimmed)) {
      closeLists();
      out.push('<hr>');
      i++; continue;
    }
    // unordered list
    const ul = /^[-*+]\s+(.*)$/.exec(trimmed);
    if (ul) {
      if (!inUl) { out.push('<ul>'); inUl = true; }
      out.push('<li>' + mdInline(esc(ul[1])) + '</li>');
      i++; continue;
    }
    // ordered list
    const ol = /^\d+[.)]\s+(.*)$/.exec(trimmed);
    if (ol) {
      if (!inOl) { out.push('<ol>'); inOl = true; }
      out.push('<li>' + mdInline(esc(ol[1])) + '</li>');
      i++; continue;
    }
    // table | a | b |
    if (/^\|.*\|$/.test(trimmed) && i + 1 < lines.length && /^\|[\s\-:|]+\|$/.test(lines[i + 1].trim())) {
      closeLists();
      const cells = trimmed.split('|');
      const hs = cells.filter((x, idx) => idx > 0 && idx < cells.length - 1).map((x) => mdInline(esc(x.trim())));
      out.push('<table><thead><tr>' + hs.map((h) => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>');
      i += 2;
      while (i < lines.length && /^\|.*\|$/.test(lines[i].trim())) {
        const c = lines[i].split('|');
        out.push('<tr>' + c.filter((x, idx) => idx > 0 && idx < c.length - 1).map((x) => '<td>' + mdInline(esc(x.trim())) + '</td>').join('') + '</tr>');
        i++;
      }
      out.push('</tbody></table>');
      continue;
    }
    // blockquote
    if (/^>\s?/.test(trimmed)) {
      closeLists();
      out.push('<blockquote>' + mdInline(esc(trimmed.replace(/^>\s?/, ''))) + '</blockquote>');
      i++; continue;
    }
    // blank line: keep an open list across a single blank line
    if (!trimmed) {
      let j = i + 1;
      while (j < lines.length && !lines[j].trim()) j++;
      const nxt = j < lines.length ? lines[j].trim() : '';
      if (inUl && /^[-*+]\s+/.test(nxt)) { i++; continue; }
      if (inOl && /^\d+[.)]\s+/.test(nxt)) { i++; continue; }
      closeLists();
      i++; continue;
    }

    // normal paragraph
    closeLists();
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^```/.test(lines[i].trim()) && !/^#{1,4}\s/.test(lines[i].trim()) && !/^>\s?/.test(lines[i].trim()) && !/^[-*+]\s+/.test(lines[i].trim()) && !/^\d+[.)]\s+/.test(lines[i].trim())) {
      para.push(lines[i]); i++;
    }
    out.push('<p>' + para.map((l) => mdInline(esc(l))).join('<br>') + '</p>');
  }
  closeLists();
  emitCode();
  return out.join('\n');
}

function renderMarkdown(src) {
  return mdParagraphs(String(src || ''));
}

// Remove trailing "Based on: ..." source-list section from an answer.
function stripBasedOn(src) {
  let s = String(src || '');
  s = s.replace(/\n?\s*Based\s*on\s*:\s*[\s\S]*$/i, '');
  s = s.replace(/\n?\s*[Rr]eferences?\s*:\s*[\s\S]*$/i, '');
  return s.trim();
}

function scrollBottom() {
  const chat = el('chat');
  chat.scrollTop = chat.scrollHeight;
}

function addUserMsg(text) {
  el('emptyHint').style.display = 'none';
  const m = document.createElement('div');
  m.className = 'msg user';
  m.innerHTML = '<div class="bubble">' + esc(text) + '</div>';
  el('chat').appendChild(m);
  scrollBottom();
  return m;
}

function addAssistantTurn() {
  el('emptyHint').style.display = 'none';
  const m = document.createElement('div');
  m.className = 'msg assistant';
  m.innerHTML = '<div class="role">Edk2Agent</div>';
  const body = document.createElement('div');
  m.appendChild(body);
  el('chat').appendChild(m);
  scrollBottom();
  return body;
}

function renderResultsInto(body, results) {
  const wrap = document.createElement('div');
  const n = (results || []).length;
  const has = n > 0;
  const title = document.createElement('div');
  title.className = 'results-title';
  title.style.cursor = 'pointer';
  title.style.userSelect = 'none';
  title.textContent = has ? '检索结果（Top ' + n + '） ▸' : '未检索到结果';
  title.addEventListener('click', () => {
    const collapsed = list.style.display === 'none';
    list.style.display = collapsed ? '' : 'none';
    title.textContent = (has ? '检索结果（Top ' + n + '） ' : '未检索到结果 ') +
      (collapsed ? '▾' : '▸');
  });
  wrap.appendChild(title);
  const list = document.createElement('div');
  list.style.display = 'none';
  (results || []).forEach((r, i) => {
    const url = r.url || '';
    const snippet = r.snippet || '';
    const t = r.title || r.section || r.file || '(无标题)';
    const div = document.createElement('div');
    div.className = 'result';
    div.innerHTML =
      '<div class="meta"><span class="num">[' + (i+1) + ']</span>' + renderConf(r.confidence) +
      '<span class="src">' + esc(r.source_display || r.source || '') + '</span></div>' +
      '<div class="title">' + esc(t) + '</div>' +
      (r.section ? '<div class="src">' + esc(r.section) + '</div>' : '') +
      (snippet ? '<div class="snippet">' + esc(snippet.substring(0, 300)) + (snippet.length > 300 ? '…' : '') + '</div>' : '') +
      (url ? '<div class="link"><a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(url) + '</a></div>' : '');
    list.appendChild(div);
  });
  wrap.appendChild(list);
  body.appendChild(wrap);
  scrollBottom();
}

async function refreshStatus() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    const h = d.daemon_health;
    if (h && h.status === 'ok') {
      setStatus('服务就绪 · 文档 ' + (h.indexed_documents || '?') + ' · ' + d.daemon_url, 'ok');
    } else if (h) {
      setStatus('daemon 未就绪', 'bad');
    } else {
      setStatus('daemon 未启动', 'bad');
    }
    if (!d.llm_configured) {
      const warn = document.createElement('div');
      warn.className = 'llm-warn';
      warn.textContent = '提示：未配置 LLM（缺少 LLM_API_KEY / LLM_BASE_URL / LLM_MODEL）。页面仍会返回检索结果，但不会生成整理后的自然语言回答。';
      el('chat').prepend(warn);
    }
  } catch (e) {
    setStatus('无法连接 Web 服务', 'bad');
  }
}

async function ask(question) {
  addUserMsg(question);
  const body = addAssistantTurn();
  const btn = el('askBtn');
  btn.disabled = true;
  let history = [];
  try { history = JSON.parse(localStorage.getItem('kb_history') || '[]'); } catch { history = []; }

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML =
    '<div class="h"><strong>回答</strong>' +
    '<span class="tag" id="modelTag" style="display:none"></span></div>' +
    '<div class="answer"></div>';
  const answerDiv = card.querySelector('.answer');
  body.appendChild(card);
  answerDiv.innerHTML = '<div class="typing"><span class="spinner"></span>正在检索知识库…</div>';

  const ctrl = new AbortController();
  let answerText = '';
  try {
    const r = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, history }),
      signal: ctrl.signal,
    });
    if (r.status === 429) {
      const d = await r.json();
      body.innerHTML = '<div class="error">' + esc(d.error || '请求过于频繁') + '</div>';
      return;
    }
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      body.innerHTML = '<div class="error">' + esc(d.error || '请求失败') + '</div>';
      return;
    }
    if (!r.body) {
      body.innerHTML = '<div class="error">响应无流式内容</div>';
      return;
    }

    const reader = r.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buf = '';
    let resultsAppended = false;
    let lastRender = 0;

    const renderThrottled = () => {
      const now = Date.now();
      if (now - lastRender > 40) {
        lastRender = now;
        answerDiv.innerHTML = renderMarkdown(answerText);
        scrollBottom();
      }
    };

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const raw = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        const evt = /^event:\s*(\S+)/m.exec(raw);
        const dataMatch = /^data:\s*(.*)$/ms.exec(raw);
        if (!evt || !dataMatch) continue;
        const type = evt[1];
        let d;
        try { d = JSON.parse(dataMatch[1]); } catch { continue; }

        if (type === 'phase') {
          answerDiv.innerHTML = '<div class="typing"><span class="spinner"></span>' + esc(d.text || '处理中…') + '</div>';
        } else if (type === 'results') {
          renderResultsInto(body, d.results, d.daemon);
          resultsAppended = true;
        } else if (type === 'delta') {
          answerText += d.text || '';
          renderThrottled();
        } else if (type === 'done') {
          const tag = el('modelTag');
          if (d.model) { tag.textContent = d.model; tag.style.display = ''; }
        } else if (type === 'error') {
          answerDiv.innerHTML = '<div class="error">' + esc(d.error || '处理出错') + '</div>';
        }
      }
    }
    // final render (flush throttled)
    answerText = stripBasedOn(answerText);
    answerDiv.innerHTML = renderMarkdown(answerText);
    scrollBottom();

    // persist history for multi-turn
    if (answerText.trim()) {
      history.push({ role: 'user', content: question });
      history.push({ role: 'assistant', content: answerText });
      try {
        localStorage.setItem('kb_history', JSON.stringify(history.slice(-10)));
      } catch {}
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      body.innerHTML = '<div class="error">请求异常：' + esc(e.message) + '</div>';
    }
  } finally {
    btn.disabled = false;
    el('q').focus();
  }
}

const exampleBox = el('examples');
EXAMPLES.forEach((ex) => {
  const b = document.createElement('button');
  b.textContent = ex;
  b.addEventListener('click', () => {
    el('q').value = ex;
    ask(ex);
  });
  exampleBox.appendChild(b);
});

el('askBtn').addEventListener('click', () => {
  const q = el('q').value.trim();
  if (q) { el('q').value = ''; ask(q); }
});
el('q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const q = el('q').value.trim();
    if (q) { el('q').value = ''; ask(q); }
  }
});

refreshStatus();
setInterval(refreshStatus, 10000);
</script>
</body>
</html>
